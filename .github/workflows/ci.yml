name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # C++26 contracts require GCC 16 with -fcontracts.
    container: gcc:16.2.0-trixie
    strategy:
      fail-fast: false
      matrix:
        preset: [ninja, ninja-asan-ubsan]
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends cmake ninja-build libgtest-dev liburing-dev pkg-config

      # libvsr is private. This key has read-only access to that repository.
      - name: Check out libvsr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: breakbadsp/libvsr
          # Match the libvsr commit in CMakeLists.txt.
          ref: 0a2a771083a92d46035df17d0ee6a0bd62fe8bd5
          path: .ci/libvsr
          ssh-key: ${{ secrets.LIBVSR_SSH_KEY }}
          persist-credentials: false

      - name: Configure
        run: cmake --preset "${{ matrix.preset }}" -DMEX_LIBVSR_SOURCE_DIR="$GITHUB_WORKSPACE/.ci/libvsr"

      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}" --parallel 2

      - name: Test
        run: ctest --preset "${{ matrix.preset }}" --output-on-failure --no-tests=error
