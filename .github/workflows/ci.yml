name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 22 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # C++26 contracts require GCC 16 with -fcontracts.
    container:
      image: gcc:16.2.0-trixie
      # The default Docker seccomp profile refuses io_uring_setup.
      options: --security-opt seccomp=unconfined
    strategy:
      fail-fast: false
      matrix:
        preset: [ninja, ninja-asan-ubsan]
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends cmake ninja-build libgtest-dev liburing-dev pkg-config python3 clang-format universal-ctags

      # libvsr is private. This key has read-only access to that repository.
      - name: Check out libvsr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: breakbadsp/libvsr
          # Match the libvsr commit in CMakeLists.txt.
          ref: 0a2a771083a92d46035df17d0ee6a0bd62fe8bd5
          path: .ci/libvsr
          ssh-key: ${{ secrets.LIBVSR_SSH_KEY }}
          persist-credentials: false

      - name: Configure
        run: cmake --preset "${{ matrix.preset }}" -DMEX_REQUIRE_STYLE_TOOLS=ON -DMEX_LIBVSR_SOURCE_DIR="$GITHUB_WORKSPACE/.ci/libvsr"

      - name: Check C++ format
        if: matrix.preset == 'ninja'
        run: cmake --build --preset ninja --target clang-format-check

      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}" --parallel 2

      - name: Test
        run: ctest --preset "${{ matrix.preset }}" --output-on-failure --no-tests=error

      - name: Install TLA+ prerequisites
        if: matrix.preset == 'ninja'
        run: apt-get install --yes --no-install-recommends default-jre-headless curl

      - name: Check out KaizenFlow
        if: matrix.preset == 'ninja'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: breakbadsp/ai-assets
          ref: 9cc69bd2ce37e86dc497580958c25b0ced7df3e0
          path: .ci/ai-assets
          persist-credentials: false

      - name: Verify TLA+ specifications
        if: matrix.preset == 'ninja'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          MEX_VERIFY_BUILD: build
        run: |
          workspace="$(pwd -P)"
          export MEX_LIBVSR_SOURCE_DIR="$workspace/.ci/libvsr"
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$workspace"
          export GIT_CONFIG_KEY_1=safe.directory GIT_CONFIG_VALUE_1="$MEX_LIBVSR_SOURCE_DIR"
          diff -u .kaizen-checks <(verification/TLA/run rules)
          printf '/.ci/\n' >> "$(git rev-parse --git-path info/exclude)"
          if [[ -n "$BASE" ]] && git cat-file -e "$BASE^{commit}"; then
            .ci/ai-assets/scripts/kaizen-checks.sh --base "$BASE"
          else
            .ci/ai-assets/scripts/kaizen-checks.sh --all
          fi
        shell: bash
