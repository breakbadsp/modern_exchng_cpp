# Example exchange config (prep/io-design-spec.md, "Configuration").
# One record per line; fields are separated by spaces or tabs.
# A line that starts with '#' is a comment. Blank lines are ignored.

# engine <core>
# Engine index is the order of the engine lines, from 0.
engine 2
engine 3

# symbol <symbol_id> <engine> <max_orders> <max_price_levels> <min_price> <max_price>
# Prices are in ticks. The engine must be declared above.
# The slot of a symbol is its order among the symbols of its engine, from 0.
symbol 1 0 100000 1024 1 1000000
symbol 2 1 100000 1024 1 1000000
symbol 3 0 10000 256 1 50000

# session <session_name> <token>   (each at most 16 bytes)
# SessionId is the order of the session lines, from 0.
session alice alice-secret
session bob bob-secret

# gateway <key> <value>   (every key is required, once; with replica lines,
# port is optional and each replica uses the gateway port of its line)
gateway address 127.0.0.1
gateway port 9000
gateway max_connections 64
# Queue capacities must be powers of two.
gateway inbound_queue_capacity 65536
gateway outbound_queue_capacity 65536

# replica <replication address:port> <gateway port>   (optional)
# One line for each copy of the exchange; see docs/replication.md. With
# replica lines, start each copy as: mex_exchange <config> <replica> <data file>
# replica 127.0.0.1:7000 9000
# replica 127.0.0.1:7001 9001
# replica 127.0.0.1:7002 9002
